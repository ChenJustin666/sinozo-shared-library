env:
- name: NACOS_USERNAME
  valueFrom:
    secretKeyRef:
      key: NACOS_USERNAME
      name: nacos-secret
- name: NACOS_PASSWORD
  valueFrom:
    secretKeyRef:
      key: NACOS_PASSWORD
      name: nacos-secret
- name: SPRING_PROFILE
  valueFrom:
    secretKeyRef:
      key: SPRING_PROFILE
      name: nacos-secret
environment: prod
image:
  name: sinozo-test/ad-puller
  pullSecret: regcred
  pullSecretData: 
  registry: swr.ap-southeast-3.myhuaweicloud.com
  tag: Ra5e65a021
java:
  enabled: true
  opts: -XX:+UseContainerSupport -XX:MaxRAMPercentage=72.0 -XX:MaxMetaspaceSize=256m
    -XX:InitialRAMPercentage=30.0 -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heapdump.hprof -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
    -Dfile.encoding=UTF-8 -DNACOS_SERVERS=nacos-clusterip.nacos.svc.cluster.local:8848
    -DNACOS_NAMESPACE=adv_test -DNACOS_GROUP=DEFAULT_GROUP -DNACOS_USERNAME=$(NACOS_USERNAME)
    -DNACOS_PASSWORD=$(NACOS_PASSWORD) -Dspring.profiles.active=$(SPRING_PROFILE)
monitoring:
  enabled: true
  path: /actuator/prometheus
  port: 8080
probes:
  enabled: true
  path: /actuator/health
  port: 8080
project: adv
resources:
  enabled: true
  limits:
    cpu: '2'
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi
service:
  name: ad-puller
  namespace: adv-prod
  port: 8080
  replicas: 2
  type: ClusterIP
