# ============================================================
# Java 后端服务 values 模板
# 默认只生成：deployment + service
# 其他功能测试通过后逐个开启
# ============================================================

# ── 项目信息 ──
project: adv
environment: test

# ── 服务配置 ──
service:
  name: ad-gateway
  namespace: adv-test
  port: 8080
  replicas: 1
  type: ClusterIP

# ── 镜像 ──
image:
  registry: swr.ap-southeast-3.myhuaweicloud.com
  name: sinozo-test/ad-gateway
  tag: latest                    # Jenkins 构建时自动覆盖
  pullSecret: regcred

# ── Java 配置 ──
java:
  enabled: true
  opts: "-Dspring.profiles.active=test -Xms512m -Xmx1024m"

# ── 资源（首次可不配，用默认值）──
resources:
  enabled: true
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 256m
    memory: 512Mi

# ══════════════════════════════════════════════════════════════
# 以下功能默认关闭，测试通过后逐个开启
# ══════════════════════════════════════════════════════════════

