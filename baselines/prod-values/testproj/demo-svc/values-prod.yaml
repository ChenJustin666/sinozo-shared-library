# ============================================================
# 生产配置 - testproj/demo-svc
# ============================================================
# Owner：运维
# 路径：baselines/prod-values/testproj/demo-svc/values-prod.yaml
#
# ⚠️ 这是【占位文件】，请运维 review 后改成实际值再 push！
#    业务方在 PR 里通常会建议数值，但最终拍板由运维决定。
#
# 修改后提交流程:
#   git add baselines/prod-values/testproj/demo-svc/
#   git commit -m "ops: demo-svc prod 配置"
#   git push origin main
#
# 部署时 Jenkins 自动拉取最新版本。
# ============================================================

# ── 副本数（生产高可用，建议 ≥ 2）──
service:
  replicas: 2

# ── 资源 requests（基于实际压测数据填写）──
resources:
  enabled: true
  requests:
    cpu: 500m
    memory: 1Gi

# ── Java JVM 生产环境（连生产 Nacos）──
java:
  enabled: true
  opts: >-
    -Dspring.application.name=demo-svc
    -Dspring.profiles.active=prod
    -Dspring.cloud.nacos.config.server-addr=nacos-prod.internal:8848
    -Dspring.cloud.nacos.config.namespace=demo-svc-prod
    -Dspring.cloud.nacos.discovery.server-addr=nacos-prod.internal:8848
    -Dspring.cloud.nacos.discovery.namespace=demo-svc-prod
    -Xms2g -Xmx4g
    -XX:+UseG1GC

# ── 生产业务变量 ──
env:
  - name: LOG_LEVEL
    value: info
  - name: SPRING_PROFILES_ACTIVE
    value: prod

# ── 探针（覆盖业务通用，可按 prod 实际改 path / 超时）──
# probes:
#   enabled: true
#   type: http
#   path: /actuator/health
#   port: 8080
#   initialDelaySeconds: 60

# ── HPA（按需，建议运行稳定 1-2 周后再开）──
# hpa:
#   enabled: true
#   minReplicas: 2
#   maxReplicas: 10
