# ============================================================
# 生产配置 - adv/ad-gateway   Owner: 运维
# 路径: baselines/prod-values/adv/ad-gateway/values-prod.yaml
#
# ⚠️ 占位文件，运维 review 后改实际值再 push
# ============================================================

# ── 副本数（先 1 跑通，稳定后按业务流量调）──
service:
  replicas: 1

# ── 资源（基于实际压测填写，limits 防失控）──
resources:
  enabled: true
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# ── Java JVM 生产环境（连生产 Nacos）──
java:
  enabled: true
  opts: >-
    -Dspring.application.name=ad-gateway
    -Dspring.profiles.active=prod
    -Dspring.cloud.nacos.config.server-addr=nacos-prod.internal:8848
    -Dspring.cloud.nacos.config.namespace=ad-gateway-prod
    -Dspring.cloud.nacos.discovery.server-addr=nacos-prod.internal:8848
    -Dspring.cloud.nacos.discovery.namespace=ad-gateway-prod
    -Xms2g -Xmx4g
    -XX:+UseG1GC

# ── 业务环境变量（按实际填）──
env: []
# 示例:
# env:
#   - name: LOG_LEVEL
#     value: info

# ============================================================
# 探针（默认关，确认健康检查接口后再开）
# ⚠️ prod 探针配错风险大，建议先 type: tcp 跑稳再换 http
# ============================================================
probes:
  enabled: false
  type: tcp                    # tcp / http
  path: /actuator/health       # type=http 时生效
  port: 8080
  liveness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30       # 5 分钟启动窗口

# ── Prometheus 监控（默认关）──
monitoring:
  enabled: false
  path: /actuator/prometheus
  port: 8080

# ============================================================
# HPA 自动伸缩（默认关，运行稳定后再开）
# 启用：改 enabled: true
# ============================================================
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  cpuTarget: 70
  memoryTarget: 0              # 0=不用；填 80=内存 80% 触发

# ============================================================
# PDB 中断保护（默认关，关键服务建议开）
# 作用：节点维护/驱逐时保留至少 minAvailable 个 pod
# 启用：改 enabled: true（前提：service.replicas >= 2）
# ============================================================
pdb:
  enabled: false
  minAvailable: 1              # 至少保留 1 个；高可用可设为 50%
  maxUnavailable: 0            # 二选一，跟 minAvailable 互斥

# ============================================================
# 节点调度 nodeSelector（默认空）
# 用法：填实际节点 label 把服务限定调度到指定节点
# 查看节点标签: kubectl get nodes --show-labels
# ============================================================
nodeSelector: {}
# 示例:
# nodeSelector:
#   node-pool: prod-app
#   disk-type: ssd

# ============================================================
# 节点调度 tolerations（默认空）
# 用法：节点打了 taint 后必须 tolerate 才能调度
# 查看 taint: kubectl describe node <name> | grep Taints
# ============================================================
tolerations: []
# 示例:
# tolerations:
#   - key: dedicated
#     operator: Equal
#     value: prod
#     effect: NoSchedule

# ============================================================
# 节点调度 affinity（默认空）
# 常见场景:
#   1. podAntiAffinity - 同服务多副本不调度同节点（高可用，推荐生产开）
#   2. podAffinity     - 跟某服务部署同节点（降低跨节点延迟）
#   3. nodeAffinity    - 复杂节点选择（比 nodeSelector 灵活）
# ============================================================
affinity: {}
# 推荐示例（多副本互斥，生产建议开）:
# affinity:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchLabels:
#               app: ad-gateway
#           topologyKey: kubernetes.io/hostname

# ============================================================
# Ingress 入口（默认关）
# 启用：改 enabled: true 并填 items
# ============================================================
ingress:
  enabled: false
  items: []
  # 示例:
  # items:
  #   - host: ad-gateway.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  #     tls: true             # HTTPS（需要先有 TLS Secret）
