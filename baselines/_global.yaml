# ============================================================
# 全局基线 (baselines/_global.yaml)
# ============================================================
# 范围：CI 读取镜像仓库与环境 project 映射
# Owner：运维 / 平台组
# Review：季度
# ============================================================

# ── 镜像基础设施 ────────────────────────────────────────────
# 默认单 organization；项目可在 _overrides.yaml 按需隔离。
image:
  registry: swr.ap-southeast-3.myhuaweicloud.com

  # 镜像 organization（华为云 SWR 的 project）映射
  # key = DEPLOY_ENV, value = SWR 上的 organization 名
  # 默认所有环境共用同一个 organization，通过不可变 tag 保证镜像一致。
  projects:
    test: sinozo
    prod: sinozo

  # K8s ImagePullSecret 名（共享库当前固定使用 regcred）
  pullSecret: regcred
  pullPolicy: IfNotPresent
