# ============================================================
# 全局基线 (baselines/_global.yaml)
# ============================================================
# 范围：所有服务部署时必加载
# Owner：运维 / 平台组
# Review：季度
# ============================================================

# ── 镜像基础设施 ────────────────────────────────────────────
# 多 project 隔离：dev/test 和 prod 用不同的 SWR organization
image:
  registry: swr.ap-southeast-3.myhuaweicloud.com

  # 镜像 organization（华为云 SWR 的 project）映射
  # key = DEPLOY_ENV, value = SWR 上的 organization 名
  # ⚠️ dev 和 test 必须用同一个 organization（否则 test 找不到 dev 构建的镜像）
  projects:
    dev:  sinozo-test
    test: sinozo-test
    prod: sinozo-prod

  # K8s ImagePullSecret 名（每个 namespace 自动创建）
  pullSecret: regcred
  pullPolicy: IfNotPresent

# ── 容器安全（合规底线）─────────────────────────────────────
# 所有容器禁止 root；所有 prod 服务强制非 root 运行
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# ── 部署策略（零停机）───────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── 资源默认值 ─────────────────────────────────────────────
# 设计：requests 默认极低（够启动就行），具体值开发在业务 values 里写
# limits 由 Helm Chart 默认值兜底（charts/generic-service/values.yaml）
resources:
  enabled: true
  requests:
    cpu: 100m
    memory: 256Mi
