# 示例文件，不要直接 apply。使用 kubeseal 生成真实 sealed-secret.yaml。
# kubectl create secret generic SERVICE_NAME-runtime \
#   --from-literal=NACOS_USERNAME='<user>' --from-literal=NACOS_PASSWORD='<password>' \
#   -n <project>-test --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: SERVICE_NAME-runtime
  namespace: <project>-test
spec:
  encryptedData: {}
  template:
    metadata:
      name: SERVICE_NAME-runtime
    type: Opaque
