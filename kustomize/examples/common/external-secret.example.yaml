# Example for clusters with External Secrets Operator and a configured SecretStore.
# Replace the store name and remote key; never put the remote secret value in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: SERVICE_NAME-runtime
  namespace: <project>-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: alicloud-secrets-manager
  target:
    name: SERVICE_NAME-runtime
    creationPolicy: Owner
  data:
    - secretKey: NACOS_USERNAME
      remoteRef:
        key: /sinozo/prod/SERVICE_NAME
        property: NACOS_USERNAME
    - secretKey: NACOS_PASSWORD
      remoteRef:
        key: /sinozo/prod/SERVICE_NAME
        property: NACOS_PASSWORD
