# 示例文件，不要提交占位内容。使用实际 SWR 凭据生成后再加入环境 overlay。
# kubectl create secret docker-registry regcred \
#   --docker-server=swr.ap-southeast-3.myhuaweicloud.com \
#   --docker-username='<user>' --docker-password='<password>' \
#   -n <project>-prod --dry-run=client -o yaml | \
# kubeseal --controller-namespace kube-system --format yaml > sealed-registry-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: regcred
  namespace: <project>-prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: regcred
    type: kubernetes.io/dockerconfigjson
