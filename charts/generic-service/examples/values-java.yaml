# ============================================================
# Java 后端服务 values 模板
# 默认只生成：Deployment + Service
# 其他功能测试通过后逐个开启
# ============================================================

# ── 项目信息 ──
project: adv
environment: test

# ── 服务配置 ──
service:
  name: ad-gateway
  namespace: adv-test
  port: 8080
  replicas: 1
  type: ClusterIP

# ── 镜像 ──
image:
  registry: swr.ap-southeast-3.myhuaweicloud.com
  name: sinozo/ad-gateway
  tag: latest                    # Jenkins 构建时自动覆盖
  pullSecret: regcred

# ── Java 配置（Nacos 纯环境变量方式）──
java:
  enabled: true
  opts: >-
    -Dspring.application.name=ad-gateway
    -Dspring.profiles.active=test
    -Dspring.cloud.nacos.config.server-addr=nacos.internal:8848
    -Dspring.cloud.nacos.config.namespace=ad-gateway-test
    -Dspring.cloud.nacos.discovery.server-addr=nacos.internal:8848
    -Dspring.cloud.nacos.discovery.namespace=ad-gateway-test
    -Xms512m -Xmx1024m

env:
  - name: NACOS_USERNAME
    valueFrom:
      secretKeyRef:
        name: nacos-auth-secret
        key: NACOS_USERNAME
  - name: NACOS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nacos-auth-secret
        key: NACOS_PASSWORD

# ── 资源 ──
resources:
  enabled: true
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 256m
    memory: 512Mi

# ══════════════════════════════════════════════════════════════
# 以下功能默认关闭，测试通过后逐个开启
# ══════════════════════════════════════════════════════════════

